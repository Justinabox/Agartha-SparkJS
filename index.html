<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Agartha World</title>
    <style>
      body {
        margin: 0;
      }
    </style>
  </head>

  <body>
    <script type="importmap">
      {
        "imports": {
          "three": "https://cdnjs.cloudflare.com/ajax/libs/three.js/0.180.0/three.module.js",
          "@sparkjsdev/spark": "https://sparkjs.dev/releases/spark/0.1.10/spark.module.js"
        }
      }
    </script>
    <script type="module">
      import * as THREE from 'three';
      import { SplatMesh } from '@sparkjsdev/spark';

      const scene = new THREE.Scene();
      const camera = new THREE.PerspectiveCamera(
        60,
        window.innerWidth / window.innerHeight,
        0.1,
        1000
      );
      const renderer = new THREE.WebGLRenderer();
      renderer.setSize(window.innerWidth, window.innerHeight);
      // Start canvas invisible so we can fade it in once the splat is ready
      Object.assign(renderer.domElement.style, {
        opacity: '0',
        transition: 'opacity 600ms ease'
      });
      document.body.appendChild(renderer.domElement);

      // Read model name from URL (?model=<name>) and build asset paths
      const params = new URLSearchParams(window.location.search);
      const modelName = params.get('model') || 'agartha-world';
      const placeholderURL = `./assets/${modelName}.jpg`;
      const splatURL = `./assets/${modelName}.spz`;

      // Placeholder overlay image covering entire canvas/viewport
      const placeholder = document.createElement('img');
      placeholder.src = placeholderURL;
      placeholder.alt = `${modelName} placeholder`;
      Object.assign(placeholder.style, {
        position: 'fixed',
        inset: '0',
        width: '100%',
        height: '100%',
        objectFit: 'cover',
        zIndex: '9999',
        backgroundColor: '#000',
        opacity: '1',
        transition: 'opacity 600ms ease',
        // Keep interactions usable beneath if desired
        pointerEvents: 'none'
      });
      document.body.appendChild(placeholder);

      const world = new SplatMesh({
        url: splatURL,
        onLoad: () => {
          // Fade in canvas and fade out placeholder instead of hard-cut "shutter"
          // Ensure at least one rendered frame before we start transitions
          requestAnimationFrame(() => {
            // Fade in the WebGL canvas
            renderer.domElement.style.opacity = '1';

            // Fade out the placeholder image, then remove it from the DOM
            if (placeholder && placeholder.parentNode) {
              console.log('placeholder fade-out start');
              placeholder.style.opacity = '0';
              const handleTransitionEnd = () => {
                placeholder.removeEventListener('transitionend', handleTransitionEnd);
                if (placeholder.parentNode) {
                  placeholder.parentNode.removeChild(placeholder);
                }
              };
              placeholder.addEventListener('transitionend', handleTransitionEnd);
            }
          });
        }
      });
      world.quaternion.set(1, 0, 0, 0);
    //   butterfly.position.set(0, 0, -3);
      scene.add(world);

      // Controls: mouse drag + hover orbiting around a focus point
      const canvas = renderer.domElement;
      let isDragging = false;
      let lastMouseX = 0;
      let lastMouseY = 0;
      const rotationSpeed = 0.003; // angular drag sensitivity

      // Orbit state (camera moves on a sphere around focusPoint)
      const focusPoint = new THREE.Vector3();
      const orbitVector = new THREE.Vector3();
      const orbitSpherical = new THREE.Spherical();
      const forward = new THREE.Vector3(0, 0, -1).applyQuaternion(camera.quaternion);
      focusPoint.copy(camera.position).add(forward);
      orbitVector.copy(camera.position).sub(focusPoint);
      if (orbitVector.lengthSq() < 1e-6) {
        orbitVector.set(0, 0, 1);
      }
      orbitSpherical.setFromVector3(orbitVector);
      const orbitState = {
        radius: Math.max(orbitSpherical.radius, 0.5),
        theta: orbitSpherical.theta,
        phi: orbitSpherical.phi
      };
      const minPolarAngle = 0.1;
      const maxPolarAngle = Math.PI - 0.1;

      // Hover orbit offsets (adds subtle motion on same sphere)
      let hoverActive = false;
      let hoverOffsetX = 0; // [-0.5, 0.5] relative to canvas center
      let hoverOffsetY = 0; // [-0.5, 0.5] relative to canvas center
      const hoverAngles = {
        targetTheta: 0,
        targetPhi: 0,
        currentTheta: 0,
        currentPhi: 0
      };
      const hoverAngleStrength = 0.2; // radians, max angular offset from hover
      const hoverLerp = 0.03; // lower = smoother, slower response

      function updateHoverFromEvent(e) {
        const rect = canvas.getBoundingClientRect();
        const x = e.clientX;
        const y = e.clientY;
        const inside =
          x >= rect.left && x <= rect.right && y >= rect.top && y <= rect.bottom;
        hoverActive = inside;
        if (!inside) {
          hoverAngles.targetTheta = 0;
          hoverAngles.targetPhi = 0;
          return;
        }
        const nx = (x - rect.left) / rect.width; // [0,1]
        const ny = (y - rect.top) / rect.height; // [0,1]
        hoverOffsetX = nx - 0.5;
        hoverOffsetY = ny - 0.5;
        hoverAngles.targetTheta = hoverOffsetX * hoverAngleStrength;
        hoverAngles.targetPhi = hoverOffsetY * hoverAngleStrength;
      }

      function onMouseDown(e) {
        isDragging = true;
        lastMouseX = e.clientX;
        lastMouseY = e.clientY;
        // keep current hover displacement so view does not snap when starting drag
      }

      function onMouseMove(e) {
        // Always keep hover offsets in sync with pointer position
        updateHoverFromEvent(e);
        if (isDragging) {
          const dx = e.clientX - lastMouseX;
          const dy = e.clientY - lastMouseY;
          lastMouseX = e.clientX;
          lastMouseY = e.clientY;

          orbitState.theta -= dx * rotationSpeed;
          orbitState.phi -= dy * rotationSpeed;
          orbitState.phi = THREE.MathUtils.clamp(
            orbitState.phi,
            minPolarAngle,
            maxPolarAngle
          );
        }
      }

      function onMouseUp(e) {
        if (!isDragging) return;
        isDragging = false;
        if (e) {
          updateHoverFromEvent(e);
        }
      }

      function onMouseLeave() {
        hoverActive = false;
        hoverAngles.targetTheta = 0;
        hoverAngles.targetPhi = 0;
      }

      function onMouseEnter(e) {
        updateHoverFromEvent(e);
      }
      function onResize() {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
      }

      canvas.addEventListener('mousedown', onMouseDown);
      window.addEventListener('mousemove', onMouseMove);
      window.addEventListener('mouseup', onMouseUp);
      canvas.addEventListener('mouseleave', onMouseLeave);
      canvas.addEventListener('mouseenter', onMouseEnter);

      // Resize handling
      window.addEventListener('resize', onResize);

      renderer.setAnimationLoop(function animate() {
        // Smooth hover offsets towards target when pointer is inside canvas
        const hoverTargetTheta = hoverActive ? hoverAngles.targetTheta : 0;
        const hoverTargetPhi = hoverActive ? hoverAngles.targetPhi : 0;
        // Slightly faster response while dragging so view keeps up with the pointer
        const lerpFactor = isDragging ? hoverLerp * 1.5 : hoverLerp;
        hoverAngles.currentTheta += (hoverTargetTheta - hoverAngles.currentTheta) * lerpFactor;
        hoverAngles.currentPhi += (hoverTargetPhi - hoverAngles.currentPhi) * lerpFactor;

        // Combine drag + hover offsets to move camera on orbit sphere
        const finalTheta = orbitState.theta + hoverAngles.currentTheta;
        const finalPhi = THREE.MathUtils.clamp(
          orbitState.phi + hoverAngles.currentPhi,
          minPolarAngle,
          maxPolarAngle
        );
        orbitSpherical.radius = orbitState.radius;
        orbitSpherical.theta = finalTheta;
        orbitSpherical.phi = finalPhi;
        orbitVector.setFromSpherical(orbitSpherical);
        camera.position.copy(focusPoint).add(orbitVector);
        camera.lookAt(focusPoint);

        renderer.render(scene, camera);
        // butterfly.rotation.y += deltaTime / 2500;
      });

      // Cleanup listeners if page unloads
      window.addEventListener('beforeunload', () => {
        canvas.removeEventListener('mousedown', onMouseDown);
        window.removeEventListener('mousemove', onMouseMove);
        window.removeEventListener('mouseup', onMouseUp);
        canvas.removeEventListener('mouseleave', onMouseLeave);
        canvas.removeEventListener('mouseenter', onMouseEnter);
        window.removeEventListener('resize', onResize);
      });
    </script>
  </body>
</html>
